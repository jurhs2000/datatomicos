# Entorno de Python del proyecto: modelo del IPC y pipeline de datos.
# Crear con:  conda env create -f environment.yml
# Versiones fijadas con las que se generaron los archivos del repositorio (2026-11-25).
name: series-tiempo-geo
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.5.5
  - pandas=3.1.1
  - scipy=1.18.1
  - statsmodels=0.15.0
  - statsforecast=2.0.1
  - matplotlib=3.11.2
  - openpyxl=3.1.5
  - ipykernel=7.4.0
  - ipywidgets=8.1.9
  - requests=2.34.2
  - geopandas=1.2.0
  - pyarrow=26.0.1
